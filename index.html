<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080a10">
  <meta name="description" content="丸窓から眺める月齢と七十二候 — Maruwado Mini">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Maruwado Mini — 丸窓</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%23080a10'/%3E%3Ccircle cx='64' cy='64' r='48' fill='%23101524' stroke='%23d9c58e' stroke-opacity='0.45' stroke-width='2.5'/%3E%3Ccircle cx='64' cy='64' r='26' fill='%231b2236'/%3E%3Cpath d='M64 38 A26 26 0 0 1 64 90 A13 26 0 0 0 64 38 Z' fill='%23f4ebd0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage">
    <header class="app-header">
      <span class="brand-ja">丸窓</span>
      <span class="brand-en">Maruwado Mini</span>
    </header>

    <section class="marumado" aria-label="丸窓 — 月相と七十二候">
      <div class="window-bezel" aria-hidden="true"></div>

      <div class="window-content">
        <div class="moon-stage">
          <svg
            id="moon-svg"
            class="moon-svg"
            viewBox="0 0 220 220"
            role="img"
            aria-labelledby="moon-svg-title"
          >
            <title id="moon-svg-title">選択日の月相と照度リング</title>
            <defs>
              <radialGradient id="moon-lit-grad" cx="42%" cy="38%" r="65%">
                <stop offset="0%" stop-color="#fff9e8" />
                <stop offset="65%" stop-color="#efe3be" />
                <stop offset="100%" stop-color="#cfc093" />
              </radialGradient>
              <radialGradient id="moon-dark-grad" cx="50%" cy="50%" r="55%">
                <stop offset="0%" stop-color="#1d2438" />
                <stop offset="100%" stop-color="#111625" />
              </radialGradient>
              <radialGradient id="moon-halo-grad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#f2e4bd" stop-opacity="0.18" />
                <stop offset="60%" stop-color="#d9c58e" stop-opacity="0.05" />
                <stop offset="100%" stop-color="#d9c58e" stop-opacity="0" />
              </radialGradient>
              <filter id="ring-glow" x="-25%" y="-25%" width="150%" height="150%">
                <feGaussianBlur stdDeviation="2.6" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            <!-- Subtle stars inside the sky -->
            <g class="sky-stars" aria-hidden="true">
              <circle cx="34" cy="48" r="1" opacity="0.45" />
              <circle cx="182" cy="36" r="1.2" opacity="0.55" />
              <circle cx="194" cy="148" r="0.9" opacity="0.35" />
              <circle cx="28" cy="166" r="1.1" opacity="0.4" />
              <circle cx="62" cy="24" r="0.8" opacity="0.3" />
              <circle cx="164" cy="192" r="0.9" opacity="0.35" />
            </g>

            <!-- Soft lunar halo scaled by illumination -->
            <circle id="moon-halo" cx="110" cy="110" r="96" fill="url(#moon-halo-grad)" opacity="0.5" />

            <!-- Outer hairline orbit ring -->
            <circle cx="110" cy="110" r="88" fill="none" stroke="rgba(217, 197, 142, 0.14)" stroke-width="1" />

            <!-- Illumination progress ring track & active arc -->
            <circle
              class="illum-track"
              cx="110"
              cy="110"
              r="76"
              fill="none"
              stroke="rgba(236, 231, 218, 0.12)"
              stroke-width="3.5"
            />
            <circle
              id="illum-ring"
              class="illum-ring"
              cx="110"
              cy="110"
              r="76"
              fill="none"
              stroke="#e6d4a2"
              stroke-width="3.5"
              stroke-linecap="round"
              transform="rotate(-90 110 110)"
              filter="url(#ring-glow)"
            />

            <!-- Astronomical moon disc -->
            <g class="moon-disc">
              <circle
                id="moon-dark"
                cx="110"
                cy="110"
                r="54"
                fill="url(#moon-dark-grad)"
                stroke="rgba(236, 231, 218, 0.16)"
                stroke-width="1"
              />
              <path id="moon-lit" d="" fill="url(#moon-lit-grad)" />
            </g>
          </svg>
        </div>

        <div class="info-block" aria-live="polite">
          <p class="moon-meta">
            <span id="moon-age" class="moon-age">月齢 0.0日</span>
            <span class="meta-sep" aria-hidden="true">·</span>
            <span id="moon-illum" class="moon-illum">照度 0%</span>
            <span class="meta-sep" aria-hidden="true">·</span>
            <span id="moon-phase-name" class="moon-phase-name">新月</span>
          </p>

          <div class="kou-block">
            <p id="kou-term" class="kou-term"></p>
            <h1 id="kou-name" class="kou-name"></h1>
            <p id="kou-reading" class="kou-reading"></p>
          </div>
        </div>
      </div>
    </section>

    <nav class="date-controls" aria-label="日付の変更">
      <button id="prev-day" type="button" class="nav-btn" aria-label="前の日へ">
        <span aria-hidden="true">&#8249;</span>
      </button>

      <div class="date-center">
        <time id="selected-date" class="date-text"></time>
        <button id="today-btn" type="button" class="today-btn" hidden>今日へ戻る</button>
      </div>

      <button id="next-day" type="button" class="nav-btn" aria-label="次の日へ">
        <span aria-hidden="true">&#8250;</span>
      </button>
    </nav>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
